<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SKYFALL — premium vertical arcade</title>
    <meta name="description" content="SKYFALL is an original modern vertical shoot 'em up built for desktop and mobile browsers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav aria-label="Primary">
        <a href="./" class="wordmark" aria-label="Restart SKYFALL">SKYFALL<span>//01</span></a>
        <div class="header-controls">
          <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false">SOUND OFF</button>
        </div>
      </nav>
    </header>
    <main>
      <h1>SKYFALL</h1>
      <div class="game-frame" id="game-frame">
        <canvas id="game" width="600" height="800" aria-label="SKYFALL vertical shooting game">
          Your browser needs Canvas support to run SKYFALL.
        </canvas>
      </div>
      <p class="controls-note"><span id="controls-text">MOVE · DODGE · AUTO FIRE</span> <span id="ultimate-control-text">SPACE — ULTIMATE</span></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
